<style>
/* ZKJ SYSTEM circuit screens (KJ, 3 Nov 2026). Every screen lives in the cube's world: gold circuit traces, platform terminals,
   watch dials, engraved plates and drawing sheets. Runs inside the portal (app/index.html) and reads its data through
   window.parent.ZFRONT_HOST. Gold is the accent; any other colour means status. Rebuild nothing here by hand from the renders:
   tools/front/renders/circuit is the approved design. */
:root{--ob:#0B0B0F;--wh:#F4F2EC;--sil:#9AA0A6;--mute:#6A6E75;--gold:#C9A84C;--gl:#E6D5A3;--hair:rgba(255,255,255,.08);--line:rgba(201,168,76,.32);
--bad:#F0806E;--ok:#5EC98D;--info:#9DB7E8;--warn:#E8B04E;
--display:"Cinzel",Georgia,serif;--body:"Inter","IBM Plex Sans Arabic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ob);color:var(--wh);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;z-index:5;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.ib{all:unset;pointer-events:auto;cursor:pointer;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(11,11,15,.7);position:relative}
.ib svg{width:22px;height:24px;display:block}.ib .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--ob)}
.ib:focus-visible{outline:1px solid var(--gl);outline-offset:3px}
.ttl{text-align:center;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.2em;padding-left:.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--sil);font-weight:400;margin-top:2px}
[dir=rtl] .ttl,[dir=rtl] .ttl small{letter-spacing:0;padding:0}
.sc{position:absolute;inset:0}
.lnk{all:unset;white-space:nowrap;position:absolute;pointer-events:auto;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--sil)}
.lnk.gold{color:var(--gl);border-bottom:1px solid var(--line);padding-bottom:2px}
[dir=rtl] .lnk,[dir=rtl] .pill{font-family:var(--body);letter-spacing:0;font-size:12.5px}
.pill{all:unset;white-space:nowrap;cursor:pointer;pointer-events:auto;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--wh);border:1px solid var(--line);border-radius:18px;padding:10px 14px;background:rgba(11,11,15,.7);text-align:center}
.pill.gold{color:#14110A;background:linear-gradient(180deg,#E9D49A,#C9A84C);border-color:transparent}
.pill[disabled]{opacity:.45;cursor:default}
.lnk:focus-visible,.pill:focus-visible,.slide:focus-visible,.gcard:focus-visible,a:focus-visible{outline:1px solid var(--gl);outline-offset:3px}
.cap{position:absolute;text-align:center}
.cap h2{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.12em;line-height:1.25}
.cap p{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--sil);margin-top:6px}
[dir=rtl] .cap h2{letter-spacing:0}[dir=rtl] .cap p{font-family:var(--body);letter-spacing:0;font-size:12.5px}
.slide{position:absolute;pointer-events:auto;height:54px;border-radius:27px;border:1px solid var(--line);background:rgba(201,168,76,.05);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;color:var(--gl);cursor:pointer;overflow:hidden;touch-action:none;user-select:none}
.slide i{position:absolute;left:6px;top:6px;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F3E3B4,#C9A84C 60%,#8E7430);box-shadow:0 0 22px rgba(201,168,76,.45);transition:left .5s cubic-bezier(.6,0,.2,1)}
.slide i:after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%) rotate(45deg);background:#14110A}
.slide.drag i{transition:none}.slide.off{opacity:.4;cursor:default}
[dir=rtl] .slide{font-family:var(--body);letter-spacing:0;font-size:13px}
.gcard{border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.list{position:absolute;pointer-events:auto;overflow-y:auto;display:grid;gap:12px;align-content:start;padding-bottom:30px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.mm{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--sil);line-height:1.7}
[dir=rtl] .mm{font-family:var(--body);letter-spacing:0;font-size:12px}
.t15{font-family:var(--display);font-size:14px;letter-spacing:.08em;font-weight:600}
[dir=rtl] .t15{letter-spacing:0}
.stt{display:inline-flex;align-items:center;gap:6px;font-size:12px}.stt:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.stt.need,.stt.waiting,.stt.failed{color:var(--bad)}.stt.ok,.stt.approved,.stt.replied{color:var(--ok)}.stt.pub,.stt.published{color:var(--info)}.stt.sch,.stt.scheduled,.stt.changes_requested{color:var(--warn)}.stt.draft,.stt.skipped,.stt.claimed{color:var(--sil)}
.cmt{padding:12px 14px;display:grid;gap:8px}
.cmt .h{display:flex;align-items:center;gap:8px;font-size:12px}.cmt .h b{font-weight:600}.cmt .h span{color:var(--mute);font-family:var(--mono);font-size:10px}.cmt .h em{margin-inline-start:auto;font-style:normal}
.cmt .h svg{width:16px;height:16px}
.cmt .h span.stt.need{color:var(--bad)}
.cmt q{font-size:14px;line-height:1.45;quotes:none;overflow-wrap:anywhere}
.cmt .ln{font-size:12px;color:var(--sil);padding-inline-start:10px;border-inline-start:1px solid var(--line)}
.rep{display:flex;gap:8px;align-items:flex-end}
.rep textarea{flex:1;min-height:38px;max-height:120px;resize:none;border-radius:19px;border:1px solid var(--hair);background:rgba(255,255,255,.03);color:var(--wh);font:inherit;font-size:13px;padding:9px 14px}
.rep textarea:focus{outline:none;border-color:var(--gl)}
.coin{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F3E3B4,#C9A84C 60%,#8E7430);position:relative;flex:none}
.coin:after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);background:#14110A}
.coin[disabled]{opacity:.4}
.lv{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 12px;text-decoration:none;color:inherit}
.lv .th{width:48px;height:62px;border-radius:10px;overflow:hidden;border:1px solid var(--hair);display:grid;place-items:center;background:#0E0E12}
.lv .th img{width:100%;height:100%;object-fit:cover;display:block}
.lv .open{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--gl)}
.plaque{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;height:48px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--wh);text-decoration:none;cursor:pointer}
.plaque span{color:var(--sil);letter-spacing:.1em;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plaque.out{color:var(--bad)}
button.plaque{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));width:100%;text-align:start;cursor:pointer}
button.plaque[disabled]{cursor:default}
[dir=rtl] .plaque{font-family:var(--body);letter-spacing:0;font-size:13px}[dir=rtl] .plaque span{letter-spacing:0;font-size:12px}
.post{position:absolute;display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:center;padding:12px;pointer-events:auto}
.post .th{width:62px;height:82px;border-radius:12px;overflow:hidden;background:#0E0E12;border:1px solid var(--hair)}
.post .th img{width:100%;height:100%;object-fit:cover;display:block}
.sheet{position:fixed;inset:0;pointer-events:auto;background:rgba(5,5,7,.82);display:grid;place-items:end center;z-index:30}
.sheet>div{width:min(560px,100%);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;background:#0E0E12;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:820px){.sheet{place-items:center}.sheet>div{border-radius:24px;border-bottom:1px solid var(--line)}}
.sheet h3{font-family:var(--display);font-size:16px;letter-spacing:.14em}
.sheet textarea{min-height:110px;border-radius:14px;border:1px solid var(--hair);background:rgba(255,255,255,.03);color:var(--wh);font:inherit;font-size:14px;padding:12px;resize:vertical}
.sheet textarea:focus{outline:none;border-color:var(--gl)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{all:unset;cursor:pointer;font-size:12px;color:var(--sil);border:1px solid var(--hair);border-radius:12px;padding:5px 10px}
.sheet .row{display:flex;gap:10px;justify-content:flex-end}
.sheet .cap2{font-size:14px;line-height:1.6;white-space:pre-wrap;max-height:50vh;overflow:auto;color:#DAD7CF}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 16px;border-radius:18px;border:1px solid var(--line);background:#121217;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--gl);z-index:40;max-width:calc(100% - 32px);text-align:center}
#toast.bad{color:var(--bad);border-color:rgba(240,128,110,.4)}
[dir=rtl] #toast{font-family:var(--body);letter-spacing:0;font-size:13px}
.qrbox{padding:14px;background:#F4F2EC;border-radius:14px;justify-self:center}.qrbox img,.qrbox canvas{width:min(64vw,240px);height:auto;display:block}
/* HQ screens (All clients, To-do, This week, Drawings, Control Center, Core): forms and cards in the same metal */
.sheet>div{max-height:88vh;overflow-y:auto;scrollbar-width:none}
.fld{display:grid;gap:6px;min-width:0}.fld>span{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--sil)}
[dir=rtl] .fld>span{font-family:var(--body);letter-spacing:0;font-size:12px}
.fld input,.fld select,.fld textarea{appearance:none;-webkit-appearance:none;width:100%;min-width:0;border-radius:12px;border:1px solid var(--hair);background:rgba(255,255,255,.03);color:var(--wh);font:inherit;font-size:14px;padding:11px 13px}
.fld textarea{min-height:92px;resize:vertical;line-height:1.5}.fld select{background-image:linear-gradient(45deg,transparent 50%,#C9A84C 50%),linear-gradient(-45deg,transparent 50%,#C9A84C 50%);background-size:5px 5px;background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-repeat:no-repeat;padding-inline-end:30px}
[dir=rtl] .fld select{background-position:17px 52%,12px 52%}
.fld select option{background:#0E0E12;color:var(--wh)}.fld input[type=color]{padding:3px;height:42px;cursor:pointer}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gl)}.fld [aria-invalid=true]{border-color:var(--bad)}
.chipsel{flex:none;min-height:36px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill.sm{padding:8px 12px;font-size:9.5px}[dir=rtl] .pill.sm{font-size:12px}
.msg{font-size:12.5px;line-height:1.5;color:var(--sil)}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.cli{padding:14px 16px;display:grid;gap:11px}.cli .h{display:flex;align-items:center;gap:12px;min-width:0}.cli .h>div{min-width:0;flex:1}
.cli .t15,.cli .mm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg{width:36px;height:36px;border-radius:50%;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center;background:#0E0E12;flex:none;font-family:var(--display);font-size:11px;color:var(--gl);letter-spacing:.06em}
.lg img{width:100%;height:100%;object-fit:cover;display:block}
.sw{display:inline-flex;gap:4px;flex:none}.sw i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.22)}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.cnt div{text-align:center;border:1px solid var(--hair);border-radius:12px;padding:8px 2px 7px;min-width:0}
.cnt b{display:block;font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2}.cnt span{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--sil);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[dir=rtl] .cnt span{font-family:var(--body);letter-spacing:0;font-size:10.5px}.cnt .hot b{color:var(--bad)}.cnt .warm b{color:var(--warn)}
.nx{all:unset;cursor:pointer;display:block;font-size:12.5px;color:#DAD7CF;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nx em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--gl);margin-inline-end:8px}
.oncube{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--gl);display:inline-flex;align-items:center;gap:7px}.oncube:before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--gold)}
[dir=rtl] .oncube{font-family:var(--body);letter-spacing:0;font-size:12px}
.chipsel{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}.chipsel::-webkit-scrollbar{display:none}
.chipsel button{all:unset;cursor:pointer;flex:none;white-space:nowrap;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--sil);border:1px solid var(--hair);border-radius:16px;padding:8px 12px}
.chipsel button[aria-pressed=true]{color:#14110A;background:linear-gradient(180deg,#E9D49A,#C9A84C);border-color:transparent}
[dir=rtl] .chipsel button{font-family:var(--body);letter-spacing:0;font-size:12px}
.copy{display:flex;gap:8px}.copy input{flex:1;min-width:0;border-radius:12px;border:1px solid var(--hair);background:rgba(255,255,255,.03);color:var(--sil);font:inherit;font-size:12px;padding:9px 12px}
.files{display:grid;gap:6px}.files a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--wh);font-size:13px;border:1px solid var(--hair);border-radius:12px;padding:8px 10px;overflow:hidden}
.files a b{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--gl);border:1px solid var(--line);border-radius:6px;padding:3px 5px;flex:none}.files a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp{display:grid;gap:6px;max-height:34vh;overflow:auto}.imp div{border:1px solid var(--hair);border-radius:10px;padding:8px 10px;font-size:12.5px;display:grid;gap:2px}.imp div.bad{border-color:rgba(240,128,110,.45)}.imp small{color:var(--sil);font-family:var(--mono);font-size:10px}
.pv{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start}.pv .th{width:84px;height:112px;border-radius:12px;overflow:hidden;background:#0E0E12;border:1px solid var(--hair);display:grid;place-items:center}.pv .th img{width:100%;height:100%;object-fit:cover;display:block}
.sw2{height:44px;border-radius:12px;border:1px solid var(--hair);display:flex;overflow:hidden}.sw2 i{flex:1}
@media (max-width:520px){.g3{grid-template-columns:1fr 1fr}}
#core-host{position:absolute;left:0;right:0;bottom:0;pointer-events:auto;overflow:hidden}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.slide i{transition:none}}
</style>

<script>
(function(){
"use strict";
var ZH=null;try{ZH=window.parent!==window&&window.parent.ZFRONT_HOST||null;}catch(e){}
